name: Verify native CPU pressure and Pi for issue 531

on:
  push:
    branches: [verify-531-native-pressure]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: 99381bee44b2e1b7618d1b55440b8350d4af06cf
      PI_CLI: client/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdiri-ai/SoduWork
          ref: 99381bee44b2e1b7618d1b55440b8350d4af06cf
          path: product
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Install locked client packages and Hub and Runner dependencies
        working-directory: product
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
          python -m pip install -r hub-backend/requirements.txt -r hub-backend/requirements-runner.txt
          python -m pip check

      - name: Verify source and runtime identities
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(node -p "require('./client/node_modules/@earendil-works/pi-coding-agent/package.json').version")" = 1.4.0
          node "$PI_CLI" --version | grep -x '1\.4\.0'
          {
            printf 'Product commit \x60%s\x60, proof commit \x60%s\x60.\n\n' "$PRODUCT_SHA" "$GITHUB_SHA"
            printf 'Hosted image %s %s, kernel %s, architecture %s, logical CPUs %s.\n\n' "$ImageOS" "$ImageVersion" "$(uname -r)" "$(uname -m)" "$(nproc)"
            printf 'Python %s, Node %s, npm %s, Pi %s.\n\n' "$(python -V | cut -d' ' -f2)" "$(node -v)" "$(npm -v)" "$(node "$PI_CLI" --version)"
            printf 'Pi CLI entry SHA-256 \x60%s\x60.\n' "$(sha256sum "$PI_CLI" | cut -d' ' -f1)"
            printf 'Source Runner SHA-256 \x60%s\x60.\n' "$(sha256sum hub-backend/runner_main.py | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise the source Hub, Runner and Pi under native CPU load
        id: pressure
        working-directory: product
        env:
          SODUWORK_531_SUMMARY: ${{ runner.temp }}/summary.json
        run: |
          python ../proof/.github/verify531/native_pressure.py \
            --repo "$PWD" --pi-cli "$PWD/$PI_CLI" --node "$(command -v node)" \
            --output "$SODUWORK_531_SUMMARY"

      - name: Upload sanitized observations
        if: ${{ !cancelled() && steps.pressure.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pressure-summary
          path: ${{ runner.temp }}/summary.json
          if-no-files-found: error
          retention-days: 7
